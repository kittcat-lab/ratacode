# RATACODE · Settings de fábrica.
# Lo copia `bin/ratacode.js` a `<casa>/settings.yaml` la PRIMERA vez que se
# estrena una casa; si la casa ya existe, no se toca lo que haya puesto el usuario.
# Con DSH 0.2, RATACODE pasa cada sección a una fila del parche del perfil web
# (`<casa>/profiles/web/cordis.patch.yml`) antes de arrancar el motor, y deja
# el original como `settings.yaml.imported` (ver `mcp/lib/casa.js`).
#
# 0 claves dentro. El usuario pone las suyas la primera vez y quedan en
# <casa>\.credentials.yaml (la web Ajustes > Models las escribe) o bien
# exportando la variable de entorno que declara cada proveedor.
#
# Proveedores: en Ajustes > Models salen las 8 APIs con clave (B.AI, OpenRouter,
# DeepSeek, Groq, Google Gemini, NVIDIA NIM, SambaNova y Cloudflare Workers AI).
# Los DOS LOCALES sin clave y sin coste — Ollama (http://127.0.0.1:11434/v1) y
# LM Studio (http://127.0.0.1:1234/v1) — siguen declarados AQUÍ (para que sus
# modelos salgan en el selector de modelos de la caja), pero la piel los esconde
# de esa lista: tienen su propia pestaña, Ajustes > «Modelos locales» (R18).
# Los locales no piden clave: no llevan `apiKeyEnv`.
# B.AI y OpenRouter se declaran aquí (llm-pi-ai) y los cinco gratuitos que
# recomendó el informe R11 también. Cada baseURL y cada id de modelo está
# comprobado en su documentación oficial (enlaces en los comentarios).
#
# DeepSeek NO se declara a propósito: DSH ya trae su adaptador nativo
# (@deepseek-ai/dsh-llm-deepseek), que registra la ruta "deepseek-official"
# contra https://api.deepseek.com y lee DEEPSEEK_API_KEY. Declarar además un
# "deepseek" en llm-pi-ai.providers no choca por id (el nativo no se llama
# "deepseek"), pero duplicaría el proveedor en el selector y sustituiría su
# catálogo real por una lista de modelos escrita a mano. Se usa el nativo.

permission:
  defaultPreset: danger-full-access

agent-default-model:
  provider: b-ai
  model: "deepseek-v4.1-flash"

ui-onboarding:
  welcomeNoticeVersion: 2026-09-28.1

llm-pi-ai:
  providers:
    # ── B.AI ──────────────────────────────────────────────────────────
    b-ai:
      displayName: B.AI
      api: openai-completions
      baseURL: https://api.b.ai/v1
      apiKeyEnv: B_AI_API_KEY
      timeoutMs: 120000
      models:
        - id: deepseek-v4.1-flash
          name: deepseek-v4.1-flash
          contextWindow: 1000000
          maxTokens: 32000
          input:
            - text
            - image
          compat:
            maxTokensField: max_tokens
            chatTemplateKwargs: {}
            chatTemplateArgs: {}
        - id: hy3
          name: hy3
        - id: glm-5.3-flash
          name: glm-5.3-flash
        - id: mimo-v2.5
          name: mimo-v2.5
        - id: qwen3.8-flash
          name: qwen3.8-flash

    # ── OpenRouter ────────────────────────────────────────────────────
    openrouter:
      displayName: OpenRouter
      api: openai-completions
      baseURL: https://openrouter.ai/api/v1
      apiKeyEnv: OPENROUTER_API_KEY
      timeoutMs: 120000
      models:
        - id: upstage/solar-mini4
          name: Solar Mini 4
          contextWindow: 524288
          maxTokens: 131072
          input:
            - text
        - id: qwen/qwen3.8-flash
          name: Qwen3.8 Flash
          contextWindow: 1000000
          maxTokens: 131072
          input:
            - text
            - image
        - id: z-ai/glm-5.3-flash
          name: GLM 5.3 Flash
          contextWindow: 1310720
          maxTokens: 131072
          input:
            - text
            - image
        - id: deepseek/deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision
          contextWindow: 1048576
          maxTokens: 131072
          input:
            - text
            - image

    # ── Groq · gratis 30 RPM / 1.000 RPD / 200K TPD ─────────────────────
    # baseURL: https://console.groq.com/docs/openai
    # modelos: https://console.groq.com/docs/models
    groq:
      displayName: Groq
      api: openai-completions
      baseURL: https://api.groq.com/openai/v1
      apiKeyEnv: GROQ_API_KEY
      timeoutMs: 120000
      models:
        - id: openai/gpt-oss-120b
          name: GPT-OSS 120B (Groq)
          contextWindow: 131072
          maxTokens: 65536
        - id: qwen/qwen3.8-27b
          name: Qwen3.8 27B (Groq, preview)
          contextWindow: 131072
          maxTokens: 16384

    # ── Google Gemini (AI Studio) · gratis, pero ENTRENA CON TUS DATOS ──
    # baseURL: https://ai.google.dev/gemini-api/docs/openai
    # modelos: https://ai.google.dev/gemini-api/docs/models
    gemini:
      displayName: "Google Gemini (gratis: entrena con tus datos)"
      api: openai-completions
      baseURL: https://generativelanguage.googleapis.com/v1beta/openai/
      apiKeyEnv: GEMINI_API_KEY
      timeoutMs: 120000
      models:
        - id: gemini-3.8-flash
          name: Gemini 3.8 Flash
          contextWindow: 1048576
          maxTokens: 65536
        - id: gemini-3.7-flash
          name: Gemini 3.7 Flash

    # ── NVIDIA NIM · gratis sólo para prototipar (NO uso comercial) ─────
    # URL y endpoint: https://docs.api.nvidia.com/nim/docs/models
    #   («URL: https://integrate.api.nvidia.com · Endpoint: POST /v1/chat/completions»)
    # ids: https://docs.api.nvidia.com/nim/reference/llm-apis
    # No publica ventana de contexto: por eso no se declara contextWindow.
    nvidia-nim:
      displayName: NVIDIA NIM (gratis para prototipar, no comercial)
      api: openai-completions
      baseURL: https://integrate.api.nvidia.com/v1
      apiKeyEnv: NVIDIA_API_KEY
      timeoutMs: 120000
      models:
        - id: deepseek-ai/deepseek-v4-flash
          name: DeepSeek V4 Flash (NIM)
        - id: deepseek-ai/deepseek-v4-pro
          name: DeepSeek V4 Pro (NIM)

    # ── SambaNova · gratis permanente 20 RPM / 20 RPD / 200K TPD ────────
    # baseURL: https://docs.sambanova.ai/docs/en/get-started/api-keys-urls
    # modelos: https://docs.sambanova.ai/docs/en/models/sambacloud-models
    sambanova:
      displayName: SambaNova
      api: openai-completions
      baseURL: https://api.sambanova.ai/v1
      apiKeyEnv: SAMBANOVA_API_KEY
      timeoutMs: 120000
      models:
        - id: MiniMax-M2.7
          name: MiniMax M2.7 (SambaNova)
          contextWindow: 196608
        - id: DeepSeek-V3.1
          name: DeepSeek V3.1 (SambaNova)
          contextWindow: 131072

    # ── Cloudflare Workers AI · lleva tu account_id EN LA URL ───────────
    # baseURL: https://developers.cloudflare.com/workers-ai/configuration/open-ai-compatibility/
    # modelos: https://developers.cloudflare.com/workers-ai/models/
    # OJO: {account_id} NO es un hueco que rellene RATACODE. Hay que cambiarlo
    # a mano en Ajustes > Models > este proveedor > «Customized settings > Base URL»,
    # poniendo el id de cuenta de Cloudflare (el token va en su campo API key).
    cloudflare-workers-ai:
      displayName: "Cloudflare Workers AI (cambia {account_id} en «Customized settings > Base URL»)"
      api: openai-completions
      baseURL: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
      apiKeyEnv: CLOUDFLARE_API_KEY
      timeoutMs: 120000
      models:
        - id: '@cf/openai/gpt-oss-120b'
          name: GPT-OSS 120B (Cloudflare)
          contextWindow: 128000
        - id: '@cf/qwen/qwen2.5-coder-32b-instruct'
          name: Qwen2.5 Coder 32B (Cloudflare)
          contextWindow: 32768

    # ── Ollama · LOCAL, sin clave y sin coste ───────────────────────────
    # El motor de tu ordenador. No lleva `apiKeyEnv` A PROPÓSITO: sin esa
    # línea la ruta queda sin autenticar (`dsh-llm-pi-ai`: `namesCredential`
    # sólo es true si el perfil nombra una credencial), que es justo lo que
    # hace Ollama por defecto en http://127.0.0.1:11434.
    # Runtime: https://ollama.com/download  ·  modelo: `ollama pull qwen3:8b`
    # Los ids de aquí son los que recomienda el informe R15 (tabla del README:
    # «qué modelo local según tu tarjeta»). Si tu modelo se llama de otra
    # forma, se cambia aquí o en Ajustes > Models.
    # OJO: `qwen2.5-coder:7b` devuelve las herramientas como TEXTO dentro del
    # mensaje y NO funciona como agente (medido en R15): no lo pongas.
    ollama:
      displayName: Ollama (local, sin clave)
      api: openai-completions
      baseURL: http://127.0.0.1:11434/v1
      timeoutMs: 600000
      models:
        - id: "qwen3:8b"
          name: Qwen3 8B (local)
          contextWindow: 40960
          maxTokens: 8192
          compat:
            supportsDeveloperRole: false
            supportsReasoningEffort: false
        - id: "lfm2.5:8b"
          name: LFM2.5 8B (local, 125K)
          contextWindow: 32768
          maxTokens: 8192
          compat:
            supportsDeveloperRole: false
            supportsReasoningEffort: false

    # ── LM Studio · LOCAL, sin clave ────────────────────────────────────
    # Arranca su servidor ANTES de usar este proveedor: `lms server start`
    # (escucha en 1234). Tampoco lleva `apiKeyEnv`, por lo mismo que Ollama.
    # El id de modelo lo pone LM Studio: míralo con
    #   curl http://127.0.0.1:1234/v1/models
    # y escribe ese id AQUÍ o en Ajustes > Models (el que trae puesto es un
    # hueco que hay que cambiar: ningún modelo se llama así).
    lmstudio:
      displayName: LM Studio (local, sin clave)
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      timeoutMs: 600000
      models:
        - id: "<el id que devuelva GET http://127.0.0.1:1234/v1/models>"
          name: LM Studio (cambia el id por el de tu modelo)
          contextWindow: 32768
          maxTokens: 8192
          compat:
            supportsDeveloperRole: false
            supportsReasoningEffort: false

# ── EL SERVIDOR MCP DE LA CASA (R27) ────────────────────────────────────────
# Esta sección NO hace falta para usar el MCP: sin ella, todo va con los valores
# de fábrica. Está aquí, comentada, para que se vea qué se puede tocar. Lo que
# de verdad importa si abres RATACODE a ChatGPT es `workspaces` (las carpetas
# donde puede trabajar; sin ella no arranca en modo HTTP).
#
# mcp:
#   workspaces:                      # OBLIGATORIO para `--http` (y para el túnel)
#     - C:\Users\tu-usuario\Projects\mi-app
#   workspace_por_defecto: C:\Users\tu-usuario\Projects\mi-app
#   permitir_peligroso: false        # `allow_dangerous` no basta: hace falta esto
#   puerto: 3778                     # (R27) el puerto del MCP por HTTP de esta casa
#   espera_por_defecto_segundos: 25  # (R27) lo que espera `run_task` dentro de la llamada
#   pasos_max: 40                    # (R27) tope de vueltas del modelo por tarea
#   tokens_max: 400000               # (R27) tope de tokens (entrada + salida) por tarea
#   timeout_por_defecto_ms: 1800000  # 30 min por tarea
#   timeout_maximo_ms: 3600000       # 1 h de techo
#   tareas_a_la_vez: 3
#   prompt_max_caracteres: 100000
#   tunel_nombre: ratacode           # (R27) túnel CON NOMBRE de Cloudflare: dirección FIJA
#   tunel_host: ratacode.kittcat.com # (R27) su hostname público (van los dos juntos)
#   precios:                         # opcional: el coste sólo sale si lo declaras
#     b-ai:
#       deepseek-v4.1-flash:
#         entrada_por_millon: 0.14
#         salida_por_millon: 0.28
#         moneda: EUR
