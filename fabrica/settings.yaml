# RATACODE · Settings de fábrica.
# Lo copia `bin/ratacode.js` a `<casa>/settings.yaml` la PRIMERA vez que se
# estrena una casa; si la casa ya existe, no se toca lo que haya puesto el usuario.
#
# 0 claves dentro. El usuario pone las suyas la primera vez y quedan en
# <casa>\.credentials.yaml (la web Ajustes > Models las escribe) o bien
# exportando la variable de entorno que declara cada proveedor.
#
# Proveedores (8 en Ajustes > Models): B.AI, OpenRouter, DeepSeek, Groq,
# Google Gemini, NVIDIA NIM, SambaNova y Cloudflare Workers AI.
# B.AI y OpenRouter se declaran aquí (llm-pi-ai) y los cinco gratuitos que
# recomendó el informe R11 también. Cada baseURL y cada id de modelo está
# comprobado en su documentación oficial (enlaces en los comentarios).
#
# DeepSeek NO se declara a propósito: DSH ya trae su adaptador nativo
# (@deepseek-ai/dsh-llm-deepseek), que registra la ruta "deepseek-official"
# contra https://api.deepseek.com y lee DEEPSEEK_API_KEY. Declarar además un
# "deepseek" en llm-pi-ai.providers no choca por id (el nativo no se llama
# "deepseek"), pero duplicaría el proveedor en el selector y sustituiría su
# catálogo real por una lista de modelos escrita a mano. Se usa el nativo.

agent-presets:
  default: standard

permission:
  defaultPreset: danger-full-access

agent-default-model:
  provider: b-ai
  model: "deepseek-v4.1-flash"

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

llm-pi-ai:
  providers:
    # ── B.AI ──────────────────────────────────────────────────────────
    b-ai:
      displayName: B.AI
      api: openai-completions
      baseURL: https://api.b.ai/v1
      apiKeyEnv: B_AI_API_KEY
      timeoutMs: 120000
      models:
        - id: deepseek-v4.1-flash
          name: deepseek-v4.1-flash
          contextWindow: 1000000
          maxTokens: 32000
          input:
            - text
            - image
          compat:
            maxTokensField: max_tokens
            chatTemplateKwargs: {}
            chatTemplateArgs: {}
        - id: hy3
          name: hy3
        - id: glm-5.3-flash
          name: glm-5.3-flash
        - id: mimo-v2.5
          name: mimo-v2.5
        - id: qwen3.8-flash
          name: qwen3.8-flash

    # ── OpenRouter ────────────────────────────────────────────────────
    openrouter:
      displayName: OpenRouter
      api: openai-completions
      baseURL: https://openrouter.ai/api/v1
      apiKeyEnv: OPENROUTER_API_KEY
      timeoutMs: 120000
      models:
        - id: upstage/solar-mini4
          name: Solar Mini 4
          contextWindow: 524288
          maxTokens: 131072
          input:
            - text
        - id: qwen/qwen3.8-flash
          name: Qwen3.8 Flash
          contextWindow: 1000000
          maxTokens: 131072
          input:
            - text
            - image
        - id: z-ai/glm-5.3-flash
          name: GLM 5.3 Flash
          contextWindow: 1310720
          maxTokens: 131072
          input:
            - text
            - image
        - id: deepseek/deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision
          contextWindow: 1048576
          maxTokens: 131072
          input:
            - text
            - image

    # ── Groq · gratis 30 RPM / 1.000 RPD / 200K TPD ─────────────────────
    # baseURL: https://console.groq.com/docs/openai
    # modelos: https://console.groq.com/docs/models
    groq:
      displayName: Groq
      api: openai-completions
      baseURL: https://api.groq.com/openai/v1
      apiKeyEnv: GROQ_API_KEY
      timeoutMs: 120000
      models:
        - id: openai/gpt-oss-120b
          name: GPT-OSS 120B (Groq)
          contextWindow: 131072
          maxTokens: 65536
        - id: qwen/qwen3.8-27b
          name: Qwen3.8 27B (Groq, preview)
          contextWindow: 131072
          maxTokens: 16384

    # ── Google Gemini (AI Studio) · gratis, pero ENTRENA CON TUS DATOS ──
    # baseURL: https://ai.google.dev/gemini-api/docs/openai
    # modelos: https://ai.google.dev/gemini-api/docs/models
    gemini:
      displayName: "Google Gemini (gratis: entrena con tus datos)"
      api: openai-completions
      baseURL: https://generativelanguage.googleapis.com/v1beta/openai/
      apiKeyEnv: GEMINI_API_KEY
      timeoutMs: 120000
      models:
        - id: gemini-3.8-flash
          name: Gemini 3.8 Flash
          contextWindow: 1048576
          maxTokens: 65536
        - id: gemini-3.7-flash
          name: Gemini 3.7 Flash

    # ── NVIDIA NIM · gratis sólo para prototipar (NO uso comercial) ─────
    # URL y endpoint: https://docs.api.nvidia.com/nim/docs/models
    #   («URL: https://integrate.api.nvidia.com · Endpoint: POST /v1/chat/completions»)
    # ids: https://docs.api.nvidia.com/nim/reference/llm-apis
    # No publica ventana de contexto: por eso no se declara contextWindow.
    nvidia-nim:
      displayName: NVIDIA NIM (gratis para prototipar, no comercial)
      api: openai-completions
      baseURL: https://integrate.api.nvidia.com/v1
      apiKeyEnv: NVIDIA_API_KEY
      timeoutMs: 120000
      models:
        - id: deepseek-ai/deepseek-v4-flash
          name: DeepSeek V4 Flash (NIM)
        - id: deepseek-ai/deepseek-v4-pro
          name: DeepSeek V4 Pro (NIM)

    # ── SambaNova · gratis permanente 20 RPM / 20 RPD / 200K TPD ────────
    # baseURL: https://docs.sambanova.ai/docs/en/get-started/api-keys-urls
    # modelos: https://docs.sambanova.ai/docs/en/models/sambacloud-models
    sambanova:
      displayName: SambaNova
      api: openai-completions
      baseURL: https://api.sambanova.ai/v1
      apiKeyEnv: SAMBANOVA_API_KEY
      timeoutMs: 120000
      models:
        - id: MiniMax-M2.7
          name: MiniMax M2.7 (SambaNova)
          contextWindow: 196608
        - id: DeepSeek-V3.1
          name: DeepSeek V3.1 (SambaNova)
          contextWindow: 131072

    # ── Cloudflare Workers AI · lleva tu account_id EN LA URL ───────────
    # baseURL: https://developers.cloudflare.com/workers-ai/configuration/open-ai-compatibility/
    # modelos: https://developers.cloudflare.com/workers-ai/models/
    # OJO: {account_id} NO es un hueco que rellene RATACODE. Hay que cambiarlo
    # a mano en Ajustes > Models > este proveedor > «Customized settings > Base URL»,
    # poniendo el id de cuenta de Cloudflare (el token va en su campo API key).
    cloudflare-workers-ai:
      displayName: "Cloudflare Workers AI (cambia {account_id} en «Customized settings > Base URL»)"
      api: openai-completions
      baseURL: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
      apiKeyEnv: CLOUDFLARE_API_KEY
      timeoutMs: 120000
      models:
        - id: '@cf/openai/gpt-oss-120b'
          name: GPT-OSS 120B (Cloudflare)
          contextWindow: 128000
        - id: '@cf/qwen/qwen2.5-coder-32b-instruct'
          name: Qwen2.5 Coder 32B (Cloudflare)
          contextWindow: 32768
