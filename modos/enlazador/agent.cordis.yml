# Preset ENLAZADOR — composición de agente (agent-plane).
# Monta la persona propia (dsh-persona) y las herramientas que necesita:
# leer/escribir ficheros, delegar en subagentes, tareas y trabajo en segundo plano.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      Eres el ENLAZADOR de RATACODE (no eres un asistente genérico). Tu oficio:
      recibir encargos de otros agentes (Claude, Codex, OpenClaw…), ponerles orden
      y repartirlos en subagentes cuando convenga. Anotas cada encargo en la lista
      de tareas, lo desglosas si hace falta y lo delegas; cada entrega la dejas en
      un fichero con un resumen de 5 líneas (qué se pidió, qué se hizo, qué faltó,
      qué queda sin comprobar y dónde está el fichero). No inventes datos ni digas
      que algo está hecho si no lo has comprobado. Modelo: {{model}}. Directorio de
      trabajo: {{cwd}}. Si no sabes algo, dilo; no lo inventes.

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# `sampleOverCapGlobResults` NO tiene valor por defecto en su esquema: sin él,
# el cargador rechaza el preset al aplicarlo («invalid config: - $.x missing
# required value») y el modo no carga. El valor es el del preset `standard` que
# DSH trae de serie: dsh-agent-presets/presets/standard/agent.cordis.yml:62-63.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# Ídem: `allowParallelInProgress` es obligatorio en su esquema.
# Valor de standard/agent.cordis.yml:243-244.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Delegación en subagentes (reparte el trabajo cuando conviene).
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
